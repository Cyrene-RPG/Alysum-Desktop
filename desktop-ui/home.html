<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Alysum</title>
  <link rel="icon" type="image/png" href="/Alysum-3.png" />
  <script src="/js/alysum-appearance-boot.js"></script>
  <link rel="stylesheet" href="/css/gradient-themes.css?v=6" />
  <script src="/js/gradient-theme-sync.js" defer></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #020b18;
      --panel: rgba(12, 20, 36, 0.88);
      --line: rgba(255, 255, 255, 0.08);
      --line-strong: rgba(255, 255, 255, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --muted-2: #64748b;
      --accent: #7c3aed;
    }

    html, body {
      height: 100%;
      overflow: auto;
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      isolation: isolate;
    }

    .atmosphere {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .atmosphere__orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
    }

    .atmosphere__orb--1 {
      width: 480px;
      height: 480px;
      top: -100px;
      left: 50%;
      transform: translateX(-60%);
      background: radial-gradient(circle, rgba(124, 58, 237, 0.5), transparent 68%);
    }

    .atmosphere__orb--2 {
      width: 360px;
      height: 360px;
      bottom: -80px;
      right: 15%;
      background: radial-gradient(circle, rgba(91, 33, 182, 0.35), transparent 70%);
    }

    .auth-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      padding: 32px 28px 28px;
      border-radius: 22px;
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      box-shadow: 0 32px 80px rgba(0, 0, 0, 0.5);
      animation: rise-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 28px;
    }

    .brand img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 10px 32px rgba(124, 58, 237, 0.4);
    }

    .brand-name {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .brand-sub {
      margin-top: 4px;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted-2);
    }

    .continue-block {
      display: none;
      margin-bottom: 20px;
      padding: 16px;
      border-radius: 14px;
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid rgba(167, 139, 250, 0.22);
      text-align: center;
    }

    .continue-block.visible { display: block; }

    .continue-block p {
      font-size: 0.86rem;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.45;
    }

    .continue-block strong { color: #e9d5ff; }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
      padding: 4px;
      margin-bottom: 22px;
      border-radius: 11px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .tab {
      padding: 9px 14px;
      border: none;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .tab.is-active {
      background: rgba(124, 58, 237, 0.28);
      color: #e9d5ff;
    }

    .tab-panel { display: none; }
    .tab-panel.is-active { display: block; }

    .btn-oauth {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px 14px;
      margin-top: 8px;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-oauth:first-of-type { margin-top: 0; }
    .btn-oauth:hover { background: rgba(255, 255, 255, 0.08); }
    .btn-oauth:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-oauth svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-oauth-discord svg { fill: #5865f2; }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 14px;
      color: var(--muted-2);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .auth-divider::before,
    .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .field { margin-bottom: 10px; }

    .field input {
      width: 100%;
      padding: 12px 13px;
      border-radius: 11px;
      border: 1px solid var(--line-strong);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
    }

    .field input::placeholder { color: var(--muted-2); }

    .field input:focus {
      border-color: rgba(167, 139, 250, 0.45);
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.12);
    }

    .account-type-label {
      display: block;
      margin: 0 0 8px;
      font-size: 0.76rem;
      font-weight: 700;
      color: #c4b5fd;
    }

    .account-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .account-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      background: rgba(255, 255, 255, 0.02);
    }

    .account-option:has(input:checked) {
      border-color: rgba(167, 139, 250, 0.35);
      background: rgba(124, 58, 237, 0.1);
    }

    .account-option input { margin: 2px 0 0; width: auto; accent-color: var(--accent); }

    .account-option-text strong { display: block; font-size: 0.82rem; }
    .account-option-text span { font-size: 0.74rem; color: var(--muted); line-height: 1.3; }

    .btn-primary {
      width: 100%;
      padding: 13px 14px;
      margin-top: 4px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, #5b21b6, #7c3aed 55%, #9333ea);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(124, 58, 237, 0.32);
    }

    .btn-primary:hover:not(:disabled) { filter: brightness(1.06); }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .btn-ghost {
      width: 100%;
      padding: 10px 14px;
      margin-top: 8px;
      border-radius: 11px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: transparent;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ghost:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }

    .auth-link {
      display: block;
      margin-top: 12px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .auth-link button {
      color: #c4b5fd;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      font-size: inherit;
      padding: 0;
    }

    .msg {
      display: none;
      margin-top: 12px;
      padding: 11px 13px;
      border-radius: 11px;
      font-size: 0.82rem;
      line-height: 1.45;
    }

    .msg.visible { display: block; }
    .msg--error { color: #fecaca; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.22); }
    .msg--success { color: #bbf7d0; background: rgba(34, 197, 94, 0.12); border: 1px solid rgba(34, 197, 94, 0.22); }

    .share-install {
      margin-top: 18px;
      text-align: center;
    }

    .share-install a {
      font-size: 0.8rem;
      font-weight: 600;
      color: #a78bfa;
      text-decoration: none;
    }

    .share-install a:hover {
      color: #e9d5ff;
      text-decoration: underline;
    }

    .local-host {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      text-align: center;
    }

    .local-host-label {
      font-size: 0.76rem;
      color: var(--muted-2);
      margin-bottom: 9px;
    }

    .btn-local {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 11px;
      border: 1px dashed rgba(34, 197, 94, 0.32);
      background: rgba(34, 197, 94, 0.06);
      color: #86efac;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .btn-local:hover { background: rgba(34, 197, 94, 0.11); }
    .btn-local svg { width: 16px; height: 16px; }
  </style>
</head>
<body>
  <div class="atmosphere" aria-hidden="true">
    <div class="atmosphere__orb atmosphere__orb--1"></div>
    <div class="atmosphere__orb atmosphere__orb--2"></div>
  </div>

  <main class="screen">
    <div class="auth-card">
      <header class="brand">
        <img src="/Alysum-3.png" alt="" width="52" height="52" />
        <div class="brand-name">Alysum</div>
        <div class="brand-sub">Writing studio</div>
      </header>

      <div class="continue-block" id="continue-block">
        <p>Signed in as <strong id="session-label"></strong></p>
        <button type="button" class="btn-primary" id="continue-btn">Continue to Studio</button>
        <button type="button" class="btn-ghost" id="sign-out-btn">Sign out</button>
      </div>

      <div id="auth-forms">
        <div class="tabs" role="tablist">
          <button type="button" class="tab is-active" id="tab-login" aria-selected="true">Sign in</button>
          <button type="button" class="tab" id="tab-signup" aria-selected="false">Create account</button>
        </div>

        <div class="tab-panel is-active" id="panel-login">
          <button type="button" id="login-google-btn" class="btn-oauth">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
            Continue with Google
          </button>
          <button type="button" id="login-discord-btn" class="btn-oauth btn-oauth-discord">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.317 4.369A19.791 19.791 0 0 0 16.558 3a13.74 13.74 0 0 0-.481.974 18.27 18.27 0 0 0-4.154 0A12.64 12.64 0 0 0 11.442 3a19.736 19.736 0 0 0-3.76 1.37C5.303 7.91 4.657 11.36 4.98 14.76a19.9 19.9 0 0 0 4.607 2.339c.37-.504.701-1.04.984-1.602a12.83 12.83 0 0 1-1.55-.744c.13-.095.258-.193.382-.294 2.987 1.38 6.226 1.38 9.177 0 .125.101.253.199.383.294-.494.29-1.013.54-1.553.745.283.56.612 1.097.984 1.601A19.86 19.86 0 0 0 23 14.76c.378-3.953-.646-7.371-2.683-10.391ZM10.19 12.67c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.723 1.842-1.635 1.842Zm6.19 0c-.897 0-1.635-.826-1.635-1.842 0-1.016.723-1.843 1.635-1.843.92 0 1.65.834 1.635 1.843 0 1.016-.715 1.842-1.635 1.842Z"/></svg>
            Continue with Discord
          </button>

          <div class="auth-divider"><span>or email</span></div>

          <div class="field"><input id="login-email" type="email" placeholder="Email" autocomplete="username" /></div>
          <div class="field"><input id="login-password" type="password" placeholder="Password" autocomplete="current-password" /></div>
          <button type="button" class="btn-primary" id="login-btn">Enter Studio</button>
          <p class="auth-link"><button type="button" id="forgot-link">Forgot password?</button></p>
        </div>

        <div class="tab-panel" id="panel-signup" hidden>
          <span class="account-type-label">How will you use Alysum?</span>
          <div class="account-options">
            <label class="account-option">
              <input type="radio" name="accountType" value="author" checked />
              <span class="account-option-text"><strong>Author</strong><span>Write, publish, track projects.</span></span>
            </label>
            <label class="account-option">
              <input type="radio" name="accountType" value="reader" />
              <span class="account-option-text"><strong>Reader</strong><span>Browse library and leave feedback.</span></span>
            </label>
            <label class="account-option">
              <input type="radio" name="accountType" value="both" />
              <span class="account-option-text"><strong>Both</strong><span>Switch between Studio and Reading.</span></span>
            </label>
          </div>

          <button type="button" id="signup-google-btn" class="btn-oauth">Continue with Google</button>
          <button type="button" id="signup-discord-btn" class="btn-oauth btn-oauth-discord">Continue with Discord</button>

          <div class="auth-divider"><span>or email</span></div>

          <div class="field"><input id="signup-username" placeholder="Username" autocomplete="username" /></div>
          <div class="field"><input id="signup-email" type="email" placeholder="Email" autocomplete="email" /></div>
          <div class="field"><input id="signup-password" type="password" placeholder="Password" autocomplete="new-password" /></div>
          <button type="button" class="btn-primary" id="signup-btn">Create Account</button>
        </div>
      </div>

      <p class="msg msg--error" id="error-msg" role="alert"></p>
      <p class="msg msg--success" id="success-msg" role="status"></p>

      <p class="share-install">
        <a href="/desktop/download.html">Download for Windows · Share with a friend</a>
      </p>

      <div class="local-host">
        <p class="local-host-label">Don't want to make an account?</p>
          <a class="btn-local" href="/writer-dashboard.html" id="local-host-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          Host Local Version Here
        </a>
      </div>
    </div>
  </main>

  <script type="module">
    import { supabase } from "/firebase.js";
    import { homeUrlForUserData, ACCOUNT_AUTHOR, ACCOUNT_READER, ACCOUNT_BOTH, setUiMode } from "/js/account-mode.js?v=1";
    import {
      authRedirectUrl,
      clearAuthCallbackFromUrl,
      clearLegacyOAuthPending,
      clearOAuthPending,
      hasOAuthPending,
      isOAuthCallbackLanding,
      OAUTH_PENDING_LOGIN_KEY,
      OAUTH_PENDING_SIGNUP_KEY,
      setOAuthPending,
      shouldAutoContinueOAuth,
    } from "/js/auth-redirect.js?v=2";
    import { wireSupabaseSession } from "/js/supabase-session.js?v=1";
    import { enableDesktopLocalHost, clearDesktopLocalHost } from "/js/desktop-auth.js?v=1";

    const STUDIO_URL = "/writer-dashboard.html";
    const READER_URL = "/reader-home.html";

    const tabLogin = document.getElementById("tab-login");
    const tabSignup = document.getElementById("tab-signup");
    const panelLogin = document.getElementById("panel-login");
    const panelSignup = document.getElementById("panel-signup");
    const authForms = document.getElementById("auth-forms");
    const continueBlock = document.getElementById("continue-block");
    const continueBtn = document.getElementById("continue-btn");
    const sessionLabel = document.getElementById("session-label");
    const signOutBtn = document.getElementById("sign-out-btn");
    const errorEl = document.getElementById("error-msg");
    const successEl = document.getElementById("success-msg");

    let oauthLoginHandled = false;
    let oauthSignupHandled = false;
    let loginInFlight = false;
    let signupInFlight = false;
    let userJustAuthenticated = false;

    const SIGNUP_ACCOUNT_TYPE_KEY = "alysum-signup-account-type";

    function goToDashboard(url) {
      clearDesktopLocalHost();
      window.location.href = url;
    }

    function showTab(name) {
      const isLogin = name === "login";
      tabLogin.classList.toggle("is-active", isLogin);
      tabSignup.classList.toggle("is-active", !isLogin);
      tabLogin.setAttribute("aria-selected", isLogin ? "true" : "false");
      tabSignup.setAttribute("aria-selected", !isLogin ? "true" : "false");
      panelLogin.classList.toggle("is-active", isLogin);
      panelSignup.classList.toggle("is-active", !isLogin);
      panelLogin.hidden = !isLogin;
      panelSignup.hidden = isLogin;
      clearMessages();
    }

    tabLogin.addEventListener("click", () => showTab("login"));
    tabSignup.addEventListener("click", () => showTab("signup"));

    const launchTab = new URLSearchParams(window.location.search).get("tab");
    if (launchTab === "signup") showTab("signup");

    function showError(text) {
      successEl.classList.remove("visible");
      successEl.textContent = "";
      errorEl.textContent = text;
      errorEl.classList.add("visible");
    }

    function showSuccess(text) {
      errorEl.classList.remove("visible");
      errorEl.textContent = "";
      successEl.textContent = text;
      successEl.classList.add("visible");
    }

    function clearMessages() {
      errorEl.classList.remove("visible");
      successEl.classList.remove("visible");
    }

    function setAuthBusy(busy) {
      for (const id of ["login-btn", "signup-btn", "login-google-btn", "login-discord-btn", "signup-google-btn", "signup-discord-btn"]) {
        const el = document.getElementById(id);
        if (el) el.disabled = busy;
      }
    }

    function pickedAccountType() {
      const typeInput = document.querySelector('input[name="accountType"]:checked');
      return typeInput ? typeInput.value : ACCOUNT_BOTH;
    }

    function isValidAccountType(t) {
      return t === ACCOUNT_AUTHOR || t === ACCOUNT_READER || t === ACCOUNT_BOTH;
    }

    async function redirectAfterLogin() {
      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if (!user) {
        goToDashboard(STUDIO_URL);
        return;
      }
      try {
        const { data, error } = await supabase.from("users").select("*").eq("id", user.id).single();
        if (error || !data) {
          goToDashboard(STUDIO_URL);
          return;
        }
        const url = homeUrlForUserData({
          username: data.username,
          displayName: data.display_name,
          accountType: data.account_type,
          account_type: data.account_type,
        });
        goToDashboard(url.startsWith("/") ? url : `/${url}`);
      } catch {
        goToDashboard(STUDIO_URL);
      }
    }

    function redirectAfterSignup(accountType) {
      if (accountType === ACCOUNT_READER) {
        setUiMode("library");
        goToDashboard(READER_URL);
        return;
      }
      setUiMode("studio");
      goToDashboard(STUDIO_URL);
    }

    function sessionLabelForUser(user) {
      if (!user) return "your account";
      if (user.email) return user.email;
      const providers = (user.identities || []).map((i) => String(i?.provider || "").toLowerCase()).filter(Boolean);
      return providers[0] || "your account";
    }

    function updateSignedInUI(session) {
      const user = session?.user;
      if (!user) {
        continueBlock.classList.remove("visible");
        authForms.hidden = false;
        sessionLabel.textContent = "";
        return;
      }
      sessionLabel.textContent = sessionLabelForUser(user);
      continueBlock.classList.add("visible");
      authForms.hidden = true;
    }

    continueBtn.addEventListener("click", () => redirectAfterLogin());

    async function startOAuth(provider, mode) {
      clearMessages();
      setAuthBusy(true);
      userJustAuthenticated = true;
      const pendingKey = mode === "signup" ? OAUTH_PENDING_SIGNUP_KEY : OAUTH_PENDING_LOGIN_KEY;
      try {
        setOAuthPending(pendingKey);
        if (mode === "signup") sessionStorage.setItem(SIGNUP_ACCOUNT_TYPE_KEY, pickedAccountType());
      } catch { /* ignore */ }

      const options = { redirectTo: authRedirectUrl("/desktop/home.html") };
      if (mode === "signup") options.data = { accountType: pickedAccountType() };

      const { error } = await supabase.auth.signInWithOAuth({ provider, options });
      if (error) {
        clearOAuthPending(pendingKey);
        showError(error.message);
        setAuthBusy(false);
      }
    }

    async function completeOAuthSignup() {
      const { data: userData } = await supabase.auth.getUser();
      const user = userData?.user;
      if (!user) return;

      let accountType = ACCOUNT_BOTH;
      try {
        const stored = sessionStorage.getItem(SIGNUP_ACCOUNT_TYPE_KEY);
        sessionStorage.removeItem(SIGNUP_ACCOUNT_TYPE_KEY);
        if (stored && isValidAccountType(stored)) accountType = stored;
      } catch { /* ignore */ }

      const { data: row, error: rowError } = await supabase.from("users").select("*").eq("id", user.id).maybeSingle();
      if (rowError) { showError(rowError.message); setAuthBusy(false); return; }
      if (row) { redirectAfterSignup(row.account_type); return; }

      const username = user.user_metadata?.username || (user.email ? user.email.split("@")[0] : "writer");
      const { error: profileError } = await supabase.from("users").insert({
        id: user.id, username, display_name: username, account_type: accountType,
        words: 0, streak: 0, daily_word_goal: 2000, writing_day_totals: {},
      });
      if (profileError) { showError(profileError.message); setAuthBusy(false); return; }
      redirectAfterSignup(accountType);
    }

    document.getElementById("login-google-btn").addEventListener("click", () => startOAuth("google", "login"));
    document.getElementById("login-discord-btn").addEventListener("click", () => startOAuth("discord", "login"));
    document.getElementById("signup-google-btn").addEventListener("click", () => startOAuth("google", "signup"));
    document.getElementById("signup-discord-btn").addEventListener("click", () => startOAuth("discord", "signup"));

    document.getElementById("login-btn").addEventListener("click", async () => {
      if (loginInFlight) return;
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      if (!email || !password) { showError("Enter email and password."); return; }
      clearMessages();
      loginInFlight = true;
      userJustAuthenticated = true;
      setAuthBusy(true);
      try {
        const { error } = await supabase.auth.signInWithPassword({ email, password });
        if (error) { showError(error.message); return; }
        await redirectAfterLogin();
      } finally {
        loginInFlight = false;
        setAuthBusy(false);
      }
    });

    document.getElementById("signup-btn").addEventListener("click", async () => {
      if (signupInFlight) return;
      const username = document.getElementById("signup-username").value.trim();
      const email = document.getElementById("signup-email").value.trim();
      const password = document.getElementById("signup-password").value;
      const accountType = pickedAccountType();
      if (!username || !email || !password) { showError("Fill all fields."); return; }
      clearMessages();
      signupInFlight = true;
      userJustAuthenticated = true;
      setAuthBusy(true);
      try {
        const { data, error } = await supabase.auth.signUp({
          email, password,
          options: { data: { username, displayName: username, accountType } },
        });
        if (error) { showError(error.message); return; }
        if (!data.user) { showError("Account created — try signing in."); return; }
        const { error: profileError } = await supabase.from("users").insert({
          id: data.user.id, username, display_name: username, account_type: accountType,
          words: 0, streak: 0, daily_word_goal: 2000, writing_day_totals: {},
        });
        if (profileError) { showError(profileError.message); return; }
        redirectAfterSignup(accountType);
      } finally {
        signupInFlight = false;
        setAuthBusy(false);
      }
    });

    document.getElementById("forgot-link").addEventListener("click", async () => {
      const email = document.getElementById("login-email").value.trim();
      if (!email) { showError("Enter your email first."); return; }
      clearMessages();
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: authRedirectUrl("reset-password.html"),
      });
      showError(error ? error.message : "");
      if (!error) showSuccess("Reset email sent if that address has an account.");
    });

    signOutBtn.addEventListener("click", async () => {
      await supabase.auth.signOut();
      clearOAuthPending(OAUTH_PENDING_LOGIN_KEY);
      oauthLoginHandled = false;
      updateSignedInUI(null);
      showSuccess("Signed out.");
    });

    document.getElementById("local-host-btn").addEventListener("click", () => enableDesktopLocalHost());

    clearLegacyOAuthPending();

    wireSupabaseSession(async (session, event) => {
      const user = session?.user;

      if (!user) {
        userJustAuthenticated = false;
        updateSignedInUI(null);
        return;
      }

      // Fresh login or sign-up — go straight to the same dashboard as the website
      if (userJustAuthenticated && event === "SIGNED_IN") {
        userJustAuthenticated = false;
        if (hasOAuthPending(OAUTH_PENDING_SIGNUP_KEY)) return;
        await redirectAfterLogin();
        return;
      }

      // OAuth return (Google / Discord)
      if (hasOAuthPending(OAUTH_PENDING_SIGNUP_KEY) && shouldAutoContinueOAuth(session, event, OAUTH_PENDING_SIGNUP_KEY)) {
        oauthSignupHandled = true;
        userJustAuthenticated = false;
        clearOAuthPending(OAUTH_PENDING_SIGNUP_KEY);
        clearAuthCallbackFromUrl();
        await completeOAuthSignup();
        return;
      }

      if (hasOAuthPending(OAUTH_PENDING_LOGIN_KEY) && shouldAutoContinueOAuth(session, event, OAUTH_PENDING_LOGIN_KEY)) {
        oauthLoginHandled = true;
        userJustAuthenticated = false;
        clearOAuthPending(OAUTH_PENDING_LOGIN_KEY);
        clearAuthCallbackFromUrl();
        await redirectAfterLogin();
        return;
      }

      // Already signed in from a previous session — stay on gate until they choose Continue
      if (event === "INITIAL_SESSION") {
        updateSignedInUI(session);
      }
    });

    if (isOAuthCallbackLanding()) {
      const signupPending = hasOAuthPending(OAUTH_PENDING_SIGNUP_KEY);
      if (signupPending) showTab("signup");
      void (async () => {
        for (let i = 0; i < 50; i++) {
          const { data } = await supabase.auth.getSession();
          if (data.session) {
            if (signupPending) await completeOAuthSignup();
            else await redirectAfterLogin();
            return;
          }
          await new Promise((r) => setTimeout(r, 200));
        }
        showError("Sign-in did not finish. Try again.");
      })();
    }
  </script>
</body>
</html>
